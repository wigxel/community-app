name: Build Check

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - approved
    branches:
      - staging
      - master

jobs:
  require-approval:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!reviews.some(r => r.state === 'APPROVED')) {
              core.setFailed('This fork PR requires maintainer approval before building with secrets.');
            }
            core.notice('Fork PR approved — building with secrets');

  build:
    needs: [require-approval]
    if: always() && (needs.require-approval.result == 'success' || needs.require-approval.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js with Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build application
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: bun run build:ci
